<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Daybook">
  <!--
    The Daybook mark. Two pages and a tick: yesterday's page sitting behind
    today's, because the whole idea of the app is that the page you did not
    finish comes with you. Green on the tick is the reserved completion
    colour (AGENTS.md) and a tick is a completion, so it is entitled to it.

    Everything sits inside the maskable safe zone — a circle of 80% diameter,
    which for a 512 box is the square from 111 to 401. The manifest declares
    "maskable any", so the indigo runs full bleed and Android may crop it to
    any shape it likes without taking a bite out of the artwork.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- yesterday -->
  <rect x="126" y="118" width="196" height="244" rx="32" fill="#ffffff" opacity="0.36" />

  <!-- today -->
  <rect x="190" y="150" width="196" height="244" rx="32" fill="#ffffff" />

  <path
    d="M236 274 L272 310 L342 226"
    fill="none"
    stroke="#10b981"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
