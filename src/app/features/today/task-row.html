<!--
  The separator is on the wrapper, not on the row that moves. A swipe
  translates the row over the action layer beneath it; a border on that
  row would slide away with it and take the list's ruling with it.

  Every row carries one, including the last — the rule under the final
  task is what the add row beneath it sits against.
-->
<div class="relative overflow-hidden border-b border-ink-200/70">
  <!--
    The action revealed under the row. Which side shows follows the
    direction of travel: a row moving right uncovers its left edge.
    Green is the reserved completion colour and this completes. The
    reschedule side is brand, not red — pushing a task on purpose is not
    the same as one going badly, and red would say it was.

    Not rendered at all on a finished row, because there is no gesture
    left to label: the swipe is disabled there. It used to promise
    "Tomorrow" on a completed row and then do nothing, since onSwipe has
    always guarded the push with a not-done check.
  -->
  @if (!done()) {
    <div
      class="pointer-events-none absolute inset-0 flex items-center justify-between px-4 text-body font-medium"
      aria-hidden="true"
    >
      <span
        class="flex items-center gap-2 transition-opacity"
        [class]="swipe.armed() ? 'text-done-700' : 'text-done-500/60'"
        [class.opacity-0]="swipe.offset() <= 0"
      >
        <span aria-hidden="true">&check;</span> Done
      </span>
      <span
        class="flex items-center gap-2 transition-opacity"
        [class]="swipe.armed() ? 'text-brand-700' : 'text-brand-500/60'"
        [class.opacity-0]="swipe.offset() >= 0"
      >
        {{ pushLabel() }} <span aria-hidden="true">&rarr;</span>
      </span>
    </div>
  }

  <div
    appSwipe
    #swipe="appSwipe"
    [appSwipeDisabled]="done()"
    (swiped)="onSwipe($event)"
    class="group relative flex items-start gap-3 bg-white px-2 py-3 transition hover:bg-ink-50"
  >
    <!--
      mt-0.5 is the one sanctioned 2px step: it optically centres the
      20px box against the first line of task text. That is alignment,
      not spacing, so it sits outside the 1/2/3/4/6/8 rule rather than
      breaking it. See styles.css.
    -->
    <button
      type="button"
      class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-control border-2 transition"
      [class]="
        done() ? 'border-done-500 bg-done-500 text-white' : 'border-ink-200 hover:border-brand-500'
      "
      [attr.aria-pressed]="done()"
      [attr.aria-label]="done() ? 'Mark as not done' : 'Mark as done'"
      (click)="toggled.emit()"
    >
      @if (done()) {
        <svg viewBox="0 0 20 20" fill="currentColor" class="tick h-3.5 w-3.5">
          <path
            fill-rule="evenodd"
            d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z"
            clip-rule="evenodd"
          />
        </svg>
      }
    </button>

    <div class="min-w-0 flex-1">
      <!--
      The text is the link, not the whole row: the row already holds two
      buttons, and nesting those inside an anchor is invalid and makes the
      hit targets fight each other.
    -->
      <a
        [routerLink]="['/today', task().id]"
        class="block text-task outline-none focus-visible:underline"
      >
        <span
          class="task-text"
          [class.is-done]="done()"
          [class.text-ink-400]="done()"
          [class.text-ink-900]="!done()"
        >
          {{ task().text }}
        </span>
      </a>

      <div class="mt-2 flex flex-wrap items-center gap-2 text-caption">
        @if (category(); as c) {
          <span
            class="inline-flex items-center gap-1 rounded-full bg-ink-100 px-2 py-1 font-medium text-ink-600"
          >
            <span class="h-1.5 w-1.5 rounded-full" [style.background]="c.colour"></span>
            {{ c.name }}
          </span>
        }
        @if (task().energy; as e) {
          <span
            class="rounded-full px-2 py-1 font-medium"
            [class]="e === 'quick' ? 'bg-quick-100 text-quick-700' : 'bg-deep-100 text-deep-700'"
          >
            {{ e }}
          </span>
        }
        <!--
          The count survives completion. It used to vanish the instant the
          row was ticked, which dropped it at the moment it meant most:
          finishing something carried four times is the win, and this is
          the only thing on the row that says so.

          It goes neutral once done, though. Red is reserved for overdue
          or badly avoided, and a finished task is neither — keeping the
          escalation would read as a reprimand for work that just got
          done.
        -->
        @if (task().carried_over_count > 0) {
          <span
            class="rounded-full px-2 py-1 font-medium"
            [class]="
              task().carried_over_count >= 3 && !done()
                ? 'bg-late-100 text-late-700'
                : 'bg-ink-100 text-ink-600'
            "
            [title]="
              done()
                ? 'Rolled over ' + task().carried_over_count + ' times before it was done'
                : 'Rolled over ' + task().carried_over_count + ' times'
            "
          >
            carried &times;{{ task().carried_over_count }}
          </span>
        }
        @if (task().completed_at; as at) {
          <span class="font-medium text-done-700">done {{ time(at) }}</span>
        }
      </div>
    </div>

    @if (!done()) {
      <button
        type="button"
        class="shrink-0 rounded-control px-2 py-1 text-caption font-medium text-ink-400 transition hover:bg-ink-100 hover:text-ink-600 group-hover:text-ink-600"
        [attr.aria-label]="'Move to ' + pushTargetDate()"
        (click)="pushed.emit()"
      >
        <span aria-hidden="true">&rarr;</span> {{ pushLabel() }}
      </button>
    }
  </div>
</div>
