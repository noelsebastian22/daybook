<!--
  Signing in happens on paper, like everything else.

  This was an always-dark poster: a literal `ink-900` field, literal white
  text and a coral glow, on the argument that /welcome painted the same
  picture and that a dark mode of a dark poster would be a second design
  rather than the same one after sundown. The paper retheme reversed it
  (docs/RETHEME-PLAN.md §1 reversal 3, Phase 6). The desk is
  `surface-sunken`, the sheet on it is `surface-raised`, and the page
  follows the theme exactly as the signed-in app does — which is what makes
  arriving here from the hero read as one product rather than a handoff to
  somebody else's sign-in page.

  Coral appears once, on the logo tile, and that is the whole of it. The
  primary action is Google's own button and "Send link" is the inverse chip,
  so there is nothing left here for a brand fill to be, and a coral glow on
  paper would be the brand signalling a state it does not have. The four
  hexes in the Google glyph below are literal because they are Google's
  mark and not ours.
-->
<div class="grid min-h-dvh place-items-center bg-surface-sunken p-6">
  <main class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <!--
        The real lockup, not a second drawing of it. This was the mark stacked
        over the word "Daybook" hand-set in text-display-lg, which meant the
        wordmark's letterforms, weight and tracking were decided here and in
        the brand asset independently, and the two were free to drift. The h1
        stays so the page keeps a heading; the lockup is what fills it.

        `font-display` is on the h1 rather than inside the brand component,
        because the wordmark is live text and inherits: the component still
        sits on surfaces that are not allowed the display face, and this is
        the one line on this page that is.

        `primary` is the only tone that can follow the theme. `light` and
        `dark` are flat marks and each one disappears against one of the two
        papers; under `primary` the tile carries the brand and the word takes
        the surface's own text colour. Size is 56 rather than 40 because that
        tone keeps the full icon tile, of which the artwork is 270/512, so the
        wordmark derives at about 31px — the `display-lg` step it was hand-set
        at before the lockup replaced it.
      -->
      <h1 class="mb-4 flex justify-center font-display">
        <app-logo variant="lockup" tone="primary" [size]="56" />
      </h1>
      <p class="text-body text-text-muted">Today's page is waiting.</p>
    </div>

    <!--
      The sheet is a page surface, and the two themes elevate it in opposite
      directions: in light it is the brightest thing here and leans on its
      shadow, in dark it is lighter than the desk and the shadow does almost
      nothing. `surface-raised` carries both, so the shadow stays plain. It
      was tinted `brand-700/20`, which put a coral cast under a sheet of
      paper for no reason a reader could have named.
    -->
    <div class="rounded-panel bg-surface-raised p-6 shadow-xl">
      <button
        type="button"
        class="flex w-full items-center justify-center gap-3 rounded-card border border-border-strong px-4 py-3 font-medium transition hover:bg-hover disabled:opacity-50"
        [disabled]="session.busy()"
        (click)="session.signInWithGoogle()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M22 12.2c0-.7-.06-1.4-.18-2H12v3.8h5.6a4.8 4.8 0 0 1-2.08 3.15v2.6h3.36C20.84 17.9 22 15.3 22 12.2Z"
          />
          <path
            fill="#34A853"
            d="M12 22c2.82 0 5.18-.93 6.9-2.53l-3.37-2.6c-.93.63-2.13 1-3.53 1-2.71 0-5-1.83-5.83-4.3H2.7v2.7A10 10 0 0 0 12 22Z"
          />
          <path
            fill="#FBBC05"
            d="M6.17 13.57a6 6 0 0 1 0-3.83V7.04H2.7a10 10 0 0 0 0 8.98l3.47-2.45Z"
          />
          <path
            fill="#EA4335"
            d="M12 5.9c1.53 0 2.9.53 3.98 1.56l2.98-2.98C17.18 2.77 14.82 1.8 12 1.8A10 10 0 0 0 2.7 7.04l3.47 2.7C7 7.73 9.29 5.9 12 5.9Z"
          />
        </svg>
        Continue with Google
      </button>

      <div class="my-6 flex items-center gap-3 text-caption text-text-subtle">
        <span class="h-px flex-1 bg-border-strong"></span>
        or
        <span class="h-px flex-1 bg-border-strong"></span>
      </div>

      @if (session.magicLinkSentTo(); as sentTo) {
        <div class="rounded-card bg-done-tint p-4 text-body text-on-done-tint">
          Link sent to <strong>{{ sentTo }}</strong
          >. Open it on this device to finish signing in.
        </div>
      } @else {
        <form (ngSubmit)="sendLink()">
          <label class="mb-2 block text-body font-medium text-text-muted" for="email">
            Or get a sign-in link by email
          </label>
          <input
            id="email"
            type="email"
            name="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            class="w-full rounded-card border border-border-strong px-4 py-3 outline-none focus:border-pen-500 focus:ring-2 focus:ring-pen-tint-strong"
            [(ngModel)]="email"
          />
          <button
            type="submit"
            class="mt-3 w-full rounded-card bg-inverse px-4 py-3 font-medium text-on-inverse transition hover:bg-inverse-hover disabled:opacity-50"
            [disabled]="session.busy() || !email()"
          >
            {{ session.busy() ? 'Sending...' : 'Send link' }}
          </button>
        </form>
      }
    </div>

    <p class="mt-6 text-center text-body">
      <a
        routerLink="/welcome"
        class="text-pen-text underline-offset-4 transition hover:text-pen-text-hover hover:underline"
      >
        What is Daybook?
      </a>
    </p>
  </main>
</div>
