<!--
  The same ink field as /welcome rather than the brand gradient it used to
  wear, so arriving here from the hero reads as one product and not a
  handoff to somebody else's sign-in page. The glow is the only brand
  colour left on the backdrop.

  The field and everything written directly on it stay literal `ink-900`
  and literal white in both themes. This is a poster, not a page: it is
  already dark, it is the same picture the marketing page paints, and a
  "dark mode" that made the dark half lighter would be a different design
  rather than the same one after sundown. Only the card floating on it
  takes the semantic tokens, because that card *is* a page surface.
-->
<div class="relative grid min-h-dvh place-items-center overflow-hidden bg-ink-900 p-6">
  <div
    class="pointer-events-none absolute -top-40 left-1/2 h-96 w-[36rem] -translate-x-1/2 rounded-full bg-brand-600/35 blur-3xl"
    aria-hidden="true"
  ></div>

  <main class="relative w-full max-w-sm">
    <div class="mb-8 text-center text-white">
      <!--
        The real lockup, not a second drawing of it. This was the mark stacked
        over the word "Daybook" hand-set in text-display-lg, which meant the
        wordmark's letterforms, weight and tracking were decided here and in
        the brand asset independently, and the two were free to drift. The h1
        stays so the page keeps a heading; the lockup is what fills it.
      -->
      <h1 class="mb-4 flex justify-center">
        <app-logo variant="lockup" tone="light" [size]="40" />
      </h1>
      <p class="text-body text-white/70">
        One page per day. Whatever you don't finish comes with you.
      </p>
    </div>

    <div class="rounded-panel bg-surface-raised p-6 shadow-xl shadow-brand-700/20">
      <button
        type="button"
        class="flex w-full items-center justify-center gap-3 rounded-card border border-border-strong px-4 py-3 font-medium transition hover:bg-hover disabled:opacity-50"
        [disabled]="session.busy()"
        (click)="session.signInWithGoogle()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M22 12.2c0-.7-.06-1.4-.18-2H12v3.8h5.6a4.8 4.8 0 0 1-2.08 3.15v2.6h3.36C20.84 17.9 22 15.3 22 12.2Z"
          />
          <path
            fill="#34A853"
            d="M12 22c2.82 0 5.18-.93 6.9-2.53l-3.37-2.6c-.93.63-2.13 1-3.53 1-2.71 0-5-1.83-5.83-4.3H2.7v2.7A10 10 0 0 0 12 22Z"
          />
          <path
            fill="#FBBC05"
            d="M6.17 13.57a6 6 0 0 1 0-3.83V7.04H2.7a10 10 0 0 0 0 8.98l3.47-2.45Z"
          />
          <path
            fill="#EA4335"
            d="M12 5.9c1.53 0 2.9.53 3.98 1.56l2.98-2.98C17.18 2.77 14.82 1.8 12 1.8A10 10 0 0 0 2.7 7.04l3.47 2.7C7 7.73 9.29 5.9 12 5.9Z"
          />
        </svg>
        Continue with Google
      </button>

      <div class="my-5 flex items-center gap-3 text-caption text-text-subtle">
        <span class="h-px flex-1 bg-border-strong"></span>
        or
        <span class="h-px flex-1 bg-border-strong"></span>
      </div>

      @if (session.magicLinkSentTo(); as sentTo) {
        <div class="rounded-card bg-done-tint p-4 text-body text-on-done-tint">
          Link sent to <strong>{{ sentTo }}</strong
          >. Open it on this device to finish signing in.
        </div>
      } @else {
        <form (ngSubmit)="sendLink()">
          <label class="mb-1.5 block text-body font-medium text-text-muted" for="email">
            Email a sign-in link
          </label>
          <input
            id="email"
            type="email"
            name="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            class="w-full rounded-card border border-border-strong px-4 py-3 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-tint-strong"
            [(ngModel)]="email"
          />
          <button
            type="submit"
            class="mt-3 w-full rounded-card bg-inverse px-4 py-3 font-medium text-on-inverse transition hover:bg-inverse-hover disabled:opacity-50"
            [disabled]="session.busy() || !email()"
          >
            {{ session.busy() ? 'Sending...' : 'Send link' }}
          </button>
        </form>
      }
    </div>

    <p class="mt-6 text-center text-body">
      <a
        routerLink="/welcome"
        class="text-white/50 underline-offset-4 transition hover:text-white/80 hover:underline"
      >
        What is Daybook?
      </a>
    </p>
  </main>
</div>
