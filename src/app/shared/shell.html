<!--
  Five links stand in front of the content at every width, so a keyboard
  user tabs through the whole drawer before reaching the page. This jumps
  them past it. Off-screen until focused; see .skip-link in styles.css.
-->
<a
  href="#content"
  class="skip-link rounded-card bg-inverse px-4 py-2 text-body font-medium text-on-inverse"
  (click)="focusContent($event)"
>
  Skip to content
</a>

<!-- mobile bar -->
<div
  class="safe-py-2 sticky top-0 z-30 flex items-center gap-2 bg-surface/80 px-2 backdrop-blur lg:hidden"
>
  <button
    type="button"
    class="grid h-10 w-10 place-items-center rounded-card text-text-muted transition hover:bg-hover-strong"
    aria-label="Open the menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(true)"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      class="h-5 w-5"
      aria-hidden="true"
    >
      <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>
  <!--
    The lockup, not a styled word. `welcome` and `login` already render the
    brand through this component; the drawer and this bar used to hand-roll
    it in the system stack, which made two wordmarks set in two faces. See
    the note in brand/logo.html — it always meant the drawer to have this.
  -->
  <app-logo variant="lockup" tone="primary" [size]="28" />

  <!--
    The app's primary action, outside the drawer, because on a phone the
    drawer is shut on every cold load — so finishing the day's last task used
    to leave Add task two taps away behind a menu. Coral fill rather than a
    ghost icon: it is a primary action, and as a ghost it would be the third
    identical grey glyph in a bar 40 pixels tall.

    The spacer after it reserves the theme toggle's width. That toggle is
    `fixed right-2` at h-9, so it floats over this bar rather than sitting in
    it, and without something holding the space this button lands underneath
    it. A width, not padding — 44px is off the spacing scale, and `w-` is a
    size, which the scale does not govern (AGENTS.md).
  -->
  <button
    type="button"
    class="ml-auto grid h-10 w-10 shrink-0 place-items-center rounded-card bg-brand-500 text-on-brand transition hover:bg-brand-600"
    aria-label="Add task"
    (click)="nav.openComposer()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" class="h-4 w-4">
      <path stroke-linecap="round" d="M12 5v14M5 12h14" />
    </svg>
  </button>
  <div class="w-9 shrink-0" aria-hidden="true"></div>
</div>

<!--
  The theme control. Top right corner, as asked, and one instance for the
  whole app rather than one per page.

  Fixed rather than placed in a header, for the same reason the expand
  button opposite it is: there are five pages and each would otherwise need
  its own copy. It lands at the right end of the mobile topbar below `lg`,
  and in the empty gutter beside the centred content column above it — the
  drawer is on the left and the corner the user asked for is not in it.

  The top inset takes the notch rather than a flat `top-2`, which would
  tuck it under the status bar on an installed iPhone.
-->
<div class="fixed right-2 top-[max(0.5rem,env(safe-area-inset-top))] z-30">
  <app-theme-toggle />
</div>

<!-- scrim, mobile only -->
@if (menuOpen()) {
  <button
    type="button"
    class="fixed inset-0 z-40 cursor-default bg-scrim lg:hidden"
    tabindex="-1"
    aria-label="Close the menu"
    (click)="menuOpen.set(false)"
  ></button>
}

<!--
  One <nav>, two behaviours: off-canvas and translated below lg, pinned
  above it. Rendering it twice would mean two elements with the same links
  and a duplicate landmark for screen readers.
-->
<nav
  class="safe-py-4 fixed inset-y-0 left-0 z-50 flex w-60 flex-col border-r border-border bg-surface-sunken px-3 transition-transform duration-200"
  [class]="navClass()"
  aria-label="Main"
>
  <div class="flex items-center justify-between gap-2 px-3 pb-3">
    <app-logo variant="lockup" tone="primary" [size]="28" />

    <!--
      Collapse lives at the drawer's top right, where the thing it acts on
      is the thing it sits inside. Desktop only: below lg the drawer is an
      overlay sheet that the scrim and Escape already close, and a second
      way to dismiss it would just be a smaller tap target for the same
      job.
    -->
    <button
      type="button"
      class="hidden h-8 w-8 place-items-center rounded-control text-text-subtle transition hover:bg-hover-strong hover:text-text lg:grid"
      aria-label="Collapse the sidebar"
      (click)="nav.toggleCollapsed()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M19 4.001H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-12a2 2 0 0 0-2-2m-15 2a1 1 0 0 1 1-1h4v14H5a1 1 0 0 1-1-1zm6 13h9a1 1 0 0 0 1-1v-12a1 1 0 0 0-1-1h-9z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </button>
  </div>

  <!--
    Add task sits above the destinations, not among them: it is the only
    thing here that does something rather than going somewhere. It is also
    the app's primary action, and it used to be a button in Today's header
    — which meant it did not exist on any other page.

    It closes the sheet itself rather than leaving that to the navigation
    handler below. Pressed on a phone while already on Today, the router
    does not move and no NavigationEnd fires, so the sheet would stay up
    covering the composer it had just opened.
  -->
  <button
    type="button"
    class="mb-3 flex w-full items-center gap-3 rounded-card px-3 py-2 text-body font-semibold text-pen-text transition hover:bg-brand-tint"
    (click)="menuOpen.set(false); nav.openComposer()"
  >
    <span
      class="grid h-5 w-5 shrink-0 place-items-center rounded-full bg-brand-500 text-on-brand"
      aria-hidden="true"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" class="h-3 w-3">
        <path stroke-linecap="round" d="M12 5v14M5 12h14" />
      </svg>
    </span>
    Add task
  </button>

  @if (queue.pending(); as waiting) {
    <p
      class="mx-1 mb-2 rounded-control bg-quick-tint px-2 py-1 text-caption font-medium text-on-quick-tint"
      aria-live="polite"
    >
      {{ waiting }} change{{ waiting === 1 ? '' : 's' }} waiting to sync
    </p>
  }

  <ul class="flex flex-1 flex-col gap-1">
    @for (item of items; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-tint text-on-brand-tint"
          #active="routerLinkActive"
          class="flex items-center gap-3 rounded-card px-3 py-2 text-body font-medium transition"
          [class]="active.isActive ? '' : 'text-text-muted hover:bg-hover-strong'"
          [attr.aria-current]="active.isActive ? 'page' : null"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            class="h-[18px] w-[18px] shrink-0"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  <div class="border-t border-border-soft pt-2">
    <a
      routerLink="/settings"
      routerLinkActive="bg-brand-tint text-on-brand-tint"
      #settingsActive="routerLinkActive"
      class="flex items-center gap-3 rounded-card px-3 py-2 text-body font-medium transition"
      [class]="settingsActive.isActive ? '' : 'text-text-muted hover:bg-hover-strong'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        class="h-[18px] w-[18px] shrink-0"
        aria-hidden="true"
      >
        <!--
          Six teeth, generated rather than drawn: root radius 5.2, tip radius
          7.4, tip half-angle 0.34 and root half-angle 0.66 of the half-pitch,
          every point placed by trig about 12,12. The teeth are therefore
          symmetric by construction, which the path this replaced was not — its
          body sat at y 10.4 against a hub at y 12, so the icon leaned, and its
          subpath ended 1.3 units from where it began and let `Z` draw a chord
          across one lobe. Both faults are now asserted in shell.spec.ts.

          Do not hand-edit a coordinate. Change a radius and regenerate the
          whole path, or the symmetry the spec checks will break.

          The hub is r=2.2 rather than 2.4 so the ring of paper between it and
          the root circle survives at the 18px this renders at: 1.2 user units
          of gap, 0.9px, after both 1.8 strokes are accounted for.
        -->
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.24 7.11L10.69 4.72A7.4 7.4 0 0 1 13.31 4.72L13.76 7.11A5.2 5.2 0 0 1 15.36 8.03L17.65 7.22A7.4 7.4 0 0 1 18.96 9.49L17.12 11.08A5.2 5.2 0 0 1 17.12 12.92L18.96 14.51A7.4 7.4 0 0 1 17.65 16.78L15.36 15.97A5.2 5.2 0 0 1 13.76 16.89L13.31 19.28A7.4 7.4 0 0 1 10.69 19.28L10.24 16.89A5.2 5.2 0 0 1 8.64 15.97L6.35 16.78A7.4 7.4 0 0 1 5.04 14.51L6.88 12.92A5.2 5.2 0 0 1 6.88 11.08L5.04 9.49A7.4 7.4 0 0 1 6.35 7.22L8.64 8.03A5.2 5.2 0 0 1 10.24 7.11Z"
        />
        <circle cx="12" cy="12" r="2.2" />
      </svg>
      Settings
    </a>
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-card px-3 py-2 text-body font-medium text-text-muted transition hover:bg-hover-strong hover:text-text"
      (click)="session.signOut()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        class="h-[18px] w-[18px] shrink-0"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 17v1.5A1.5 1.5 0 0 1 13.5 20h-7A1.5 1.5 0 0 1 5 18.5v-13A1.5 1.5 0 0 1 6.5 4h7A1.5 1.5 0 0 1 15 5.5V7M10 12h9m0 0-2.5-2.5M19 12l-2.5 2.5"
        />
      </svg>
      Sign out
    </button>
  </div>
</nav>

<!--
  tabindex="-1" so the skip link can put focus here. Without it the
  browser scrolls to the anchor but leaves focus on the link, and the
  next Tab goes straight back into the drawer.
-->
<!--
  The way back in. It only exists while the drawer is folded away, and it
  is placed rather than inlined into a page header because there are five
  pages and they would each need their own copy. The content column is
  centred in a max-w-2xl column, so the top-left of the wide area is
  empty at
  every width this button appears at.
-->
@if (nav.collapsed()) {
  <!--
    A rail, not a button, since folding the drawer away also folds away the
    Add task inside it. Both controls are the same 36px chip; only the add
    takes the coral fill, because only it is a primary action rather than a
    way of getting somewhere.
  -->
  <div class="fixed left-2 top-2 z-30 hidden flex-col gap-2 lg:flex">
    <button
      type="button"
      class="grid h-9 w-9 place-items-center rounded-card bg-surface-raised text-text-muted shadow-sm ring-1 ring-border transition hover:text-text"
      aria-label="Expand the sidebar"
      (click)="nav.toggleCollapsed()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M19 4.001H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-12a2 2 0 0 0-2-2m-15 2a1 1 0 0 1 1-1h4v14H5a1 1 0 0 1-1-1zm6 13h9a1 1 0 0 0 1-1v-12a1 1 0 0 0-1-1h-9z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </button>

    <button
      type="button"
      class="grid h-9 w-9 place-items-center rounded-card bg-brand-500 text-on-brand shadow-sm transition hover:bg-brand-600"
      aria-label="Add task"
      (click)="nav.openComposer()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" class="h-4 w-4">
        <path stroke-linecap="round" d="M12 5v14M5 12h14" />
      </svg>
    </button>
  </div>
}

<main
  id="content"
  tabindex="-1"
  class="outline-none transition-[padding] duration-200"
  [class]="nav.collapsed() ? 'lg:pl-0' : 'lg:pl-60'"
>
  <!--
    In the flow above the outlet, not floating: the composer and the toasts
    both own the bottom of the viewport, and a banner that overlapped
    either would be worse than no banner. Renders itself only on an iOS
    browser that is not already the installed app.
  -->
  <div class="px-4">
    <app-install-hint />
  </div>
  <router-outlet />
</main>
