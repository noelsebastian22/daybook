<div class="relative">
  <!--
    Icon-only, so the label carries the state as well as the action. The
    global :focus-visible ring covers it; there is no per-element ring here
    on purpose.
  -->
  <button
    type="button"
    class="grid h-9 w-9 place-items-center rounded-card text-text-muted transition hover:bg-hover-strong hover:text-text"
    [attr.aria-label]="triggerLabel() + '. Change the theme'"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    (click)="open.set(!open())"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      class="h-[18px] w-[18px]"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="options[activeIndex()].icon" />
    </svg>
  </button>

  @if (open()) {
    <app-popover
      class="absolute right-0 top-full z-50 mt-2"
      label="Theme"
      dismissLabel="Close the theme menu"
      (closed)="open.set(false)"
    >
      <!--
        A radiogroup, not a set of toggles. There are three states and
        exactly one of them is on, which is what aria-checked on a radio
        says and what aria-pressed cannot.
      -->
      <div role="radiogroup" aria-label="Theme">
        @for (option of options; track option.value) {
          <button
            type="button"
            role="radio"
            class="flex w-full items-center gap-3 rounded-control px-3 py-2 text-left text-body transition hover:bg-hover"
            [class]="
              option.value === theme.choice() ? 'font-semibold text-brand-text' : 'text-text'
            "
            [attr.aria-checked]="option.value === theme.choice()"
            (click)="choose(option.value)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="h-[18px] w-[18px] shrink-0"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="option.icon" />
            </svg>
            <span class="flex-1">{{ option.label }}</span>
            @if (option.value === 'system') {
              <!-- What "system" currently resolves to, which is the one thing
                   the word itself does not say. -->
              <span class="text-caption text-text-subtle">{{ theme.resolved() }}</span>
            }
          </button>
        }
      </div>
    </app-popover>
  }
</div>
