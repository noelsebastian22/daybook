<div class="rounded-panel border-2 border-dashed border-border-strong px-6 py-10 text-center">
  <!--
    The illustration is painted from the semantic tokens rather than from
    hexes. It draws a *page*, and a page that stayed white on a dark screen
    would be the brightest thing in the app sitting inside the emptiest one.

    Green does not change meaning with the light, so the tick is the same
    green in both themes — but it reads `--color-done-500` rather than a
    literal, because "the same in both themes" is a property of the *token*
    and hard-coding it means the illustration silently stops matching the
    app the moment the green moves. It did: D5 darkened done-500 to clear
    the contrast floor on the real checkbox, the heat map and the chart bars
    followed, and this tick was left behind as the old #10b981.

    The caret and the front sheet's edge were literal indigo until the
    retheme, when the thing they
    were drawing — a stroke of ink on paper — stopped being the brand colour
    and became the pen. Both read `--color-pen-text`, so they follow the theme
    like every other written mark. Coral could not take this job: it is a fill,
    and a 3px coral hairline beside the overdue red is exactly what AGENTS.md
    forbids.
  -->
  <svg
    viewBox="0 0 168 128"
    class="mx-auto h-28 w-auto"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <!-- the ground every scene sits on, so they share a horizon -->
    <ellipse cx="84" cy="116" rx="46" ry="5" fill="var(--color-border-soft)" />

    @switch (scene()) {
      @case ('clear') {
        <!-- a finished page: every row struck through and ticked -->
        <g>
          <rect
            x="46"
            y="14"
            width="76"
            height="96"
            rx="10"
            fill="var(--color-surface-raised)"
            stroke="var(--color-border-strong)"
            stroke-width="2"
          />
          <path d="M58 30h30" stroke="var(--color-border-strong)" stroke-width="3" />
          @for (row of rows; track row) {
            <path
              [attr.d]="'M74 ' + row + 'h34'"
              stroke="var(--color-border-soft)"
              stroke-width="4"
            />
            <path
              [attr.d]="'M58 ' + row + 'l3.5 3.5L68 ' + (row - 5)"
              stroke="var(--color-done-500)"
              stroke-width="3"
            />
          }
        </g>
      }

      @case ('blank') {
        <!-- an unwritten page, with the caret waiting on the first line -->
        <g>
          <rect
            x="46"
            y="14"
            width="76"
            height="96"
            rx="10"
            fill="var(--color-surface-raised)"
            stroke="var(--color-border-strong)"
            stroke-width="2"
          />
          <path d="M58 30h30" stroke="var(--color-border-strong)" stroke-width="3" />
          <!-- the caret sits on the first ruled line, not above it -->
          <path d="M60 52v14" stroke="var(--color-pen-text)" stroke-width="3" />
          <path
            d="M70 59h38M58 78h52M58 94h34"
            stroke="var(--color-border-soft)"
            stroke-width="4"
          />
        </g>
      }

      @case ('filtered') {
        <!--
          Two full pages behind an empty one. The tasks did not go
          anywhere; the page in front is just the wrong page to be
          looking at.
        -->
        <g>
          <rect
            x="16"
            y="26"
            width="62"
            height="80"
            rx="9"
            fill="var(--color-surface-sunken)"
            stroke="var(--color-border-strong)"
            stroke-width="2"
            transform="rotate(-14 47 66)"
          />
          <path
            d="M27 54h30M27 68h22M27 82h26"
            stroke="var(--color-border-strong)"
            stroke-width="3.5"
            transform="rotate(-14 47 66)"
          />
          <rect
            x="90"
            y="26"
            width="62"
            height="80"
            rx="9"
            fill="var(--color-surface-sunken)"
            stroke="var(--color-border-strong)"
            stroke-width="2"
            transform="rotate(14 121 66)"
          />
          <path
            d="M101 54h30M101 68h22M101 82h26"
            stroke="var(--color-border-strong)"
            stroke-width="3.5"
            transform="rotate(14 121 66)"
          />
          <rect
            x="53"
            y="18"
            width="62"
            height="88"
            rx="10"
            fill="var(--color-surface-raised)"
            stroke="var(--color-pen-text)"
            stroke-width="2"
          />
          <!-- The front sheet's title line. Blush `brand-tint-strong` until
               17 Sep, which worked beside the old indigo border and read as a
               smudge beside the navy pen edge above it — and was the only pink
               in any illustration. The pen edge already says which sheet is
               being looked at, so the line goes back to the neutral every
               other scene uses (RETHEME-PLAN D6). -->
          <path d="M64 32h26" stroke="var(--color-border-strong)" stroke-width="3" />
        </g>
      }

      @case ('quiet') {
        <!--
          A page that was never written on. Dashed, the same way the
          calendar draws a day with no snapshot as a hairline rather than
          a zero — an absence of a record, not a record of nothing.
        -->
        <g>
          <rect
            x="46"
            y="14"
            width="76"
            height="96"
            rx="10"
            fill="var(--color-surface-raised)"
            stroke="var(--color-border-strong)"
            stroke-width="2"
            stroke-dasharray="7 6"
          />
          <path d="M58 30h30" stroke="var(--color-border-soft)" stroke-width="3" />
        </g>
      }
    }
  </svg>

  <p class="mt-4 font-medium text-text-muted">{{ title() }}</p>

  <div class="mt-3 empty:hidden">
    <ng-content />
  </div>
</div>
