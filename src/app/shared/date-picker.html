<!-- click-outside target; sits under the panel -->
<button
  type="button"
  class="fixed inset-0 z-40 cursor-default"
  tabindex="-1"
  aria-label="Close the date picker"
  (click)="closed.emit()"
></button>

<div
  class="relative z-50 w-72 rounded-panel bg-surface-raised p-2 shadow-lg ring-1 ring-border-strong"
  role="dialog"
  aria-label="Choose a date"
>
  <!-- shortcuts -->
  <div class="flex flex-col">
    @for (s of shortcuts(); track s.date; let first = $first) {
      <button
        #option
        type="button"
        class="flex items-center justify-between rounded-control px-3 py-2 text-left text-body transition hover:bg-hover"
        [class]="s.date === date() ? 'font-semibold text-pen-text' : 'text-text'"
        [attr.aria-label]="s.label + ', ' + full(s.date)"
        (click)="choose(s.date)"
      >
        <span>{{ s.label }}</span>
        <span class="text-caption text-text-subtle">{{ s.hint }}</span>
      </button>
    }
  </div>

  <!-- month grid -->
  <div class="mt-1 border-t border-border-soft pt-2">
    <div class="flex items-center justify-between px-2 pb-1">
      <p class="text-body font-semibold">{{ label() }}</p>
      <div class="flex items-center gap-1">
        <button
          type="button"
          class="grid h-7 w-7 place-items-center rounded-control text-text-subtle transition hover:bg-hover-strong hover:text-text-muted disabled:text-text-disabled disabled:hover:bg-transparent disabled:hover:text-text-disabled"
          [disabled]="atFirstMonth()"
          aria-label="Previous month"
          (click)="stepMonth(-1)"
        >
          <span aria-hidden="true">&lsaquo;</span>
        </button>
        <button
          type="button"
          class="grid h-7 w-7 place-items-center rounded-control text-text-subtle transition hover:bg-hover-strong hover:text-text-muted"
          aria-label="Next month"
          (click)="stepMonth(1)"
        >
          <span aria-hidden="true">&rsaquo;</span>
        </button>
      </div>
    </div>

    <div
      class="grid grid-cols-7 gap-0.5 px-1 pb-1 text-center text-caption font-medium text-text-subtle"
    >
      @for (d of weekdayHeadings; track $index) {
        <span aria-hidden="true">{{ d }}</span>
      }
    </div>

    <div class="grid grid-cols-7 gap-0.5 px-1">
      @for (cell of cells(); track $index) {
        @if (cell) {
          <button
            type="button"
            class="grid h-8 place-items-center rounded-control text-body transition disabled:text-text-disabled disabled:hover:bg-transparent"
            [class]="dayClass(cell)"
            [disabled]="cell < todayDate"
            [attr.aria-label]="full(cell)"
            [attr.aria-pressed]="cell === date()"
            (click)="choose(cell)"
          >
            {{ +cell.slice(8) }}
          </button>
        } @else {
          <span></span>
        }
      }
    </div>
  </div>

  <!-- reminder time -->
  <div class="mt-1 flex items-center gap-2 border-t border-border-soft px-2 pt-2">
    <!--
      A drawn clock, not U+23F0. That character renders as a full-colour
      emoji on every platform the app runs on, which means it ignores its
      own `text-text-subtle` and was the one saturated multicolour mark
      anywhere in the signed-in app — a red plastic alarm clock sitting on
      paper and ink. A stroked SVG inherits `currentColor` and follows the
      theme, like the empty-state illustrations.
    -->
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      class="h-4 w-4 shrink-0 text-text-subtle"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="8.5" />
      <path stroke-linecap="round" d="M12 7.5V12l3 2" />
    </svg>
    <input
      type="time"
      class="min-w-0 flex-1 rounded-control bg-surface-sunken px-2 py-1.5 text-body outline-none focus:ring-2 focus:ring-focus"
      [value]="time() ?? ''"
      aria-label="Reminder time"
      (change)="onTime($event)"
    />
    @if (time()) {
      <button
        type="button"
        class="grid h-7 w-7 place-items-center rounded-control text-text-subtle transition hover:bg-hover-strong hover:text-text-muted"
        aria-label="Clear the reminder time"
        (click)="picked.emit({ date: date(), time: null })"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    }
  </div>
</div>
