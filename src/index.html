<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Daybook</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="One page per day. Whatever you don't finish comes with you." />
    <meta name="theme-color" content="#4f46e5" />

    <!-- iOS has no automatic install prompt, so these have to be set by hand. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daybook" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- SVG first: browsers that understand it take it and scale it crisply,
         the rest fall through to the .ico. Both are built from public/icon.svg
         by tools/build-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
